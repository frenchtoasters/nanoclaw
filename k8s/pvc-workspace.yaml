---
# Workspace PVCs for NanoClaw
# These provide persistent storage for group data, global shared data, and config.
#
# For kind/local-dev: uses hostPath PVs provisioned via kind extraMounts.
#   The Taskfile cluster:create task configures the kind node to mount host dirs.
#   hostPath PVs on a single-node cluster naturally support ReadWriteMany.
#
# For production: set storageClassName to an RWX-capable class (e.g., efs-sc for AWS EFS,
#   standard-rwx for GCP Filestore, azurefile for AKS) and remove the static PVs below.

# ─── Static PVs for kind (hostPath) ─────────────────────────────────────────
# These bind to directories mounted into the kind node via extraMounts.
# Delete these when deploying to a real cluster with dynamic provisioning.

apiVersion: v1
kind: PersistentVolume
metadata:
  name: nanoclaw-global-pv
  labels:
    app: nanoclaw
    component: storage
    type: local-dev
spec:
  capacity:
    storage: 5Gi
  accessModes:
    - ReadWriteMany
  storageClassName: nanoclaw-local
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data/nanoclaw/global
    type: DirectoryOrCreate
---
apiVersion: v1
kind: PersistentVolume
metadata:
  name: nanoclaw-groups-pv
  labels:
    app: nanoclaw
    component: storage
    type: local-dev
spec:
  capacity:
    storage: 1Gi
  accessModes:
    - ReadWriteMany
  storageClassName: nanoclaw-local
  persistentVolumeReclaimPolicy: Retain
  hostPath:
    path: /data/nanoclaw/groups
    type: DirectoryOrCreate
---
# ─── PVCs ────────────────────────────────────────────────────────────────────

# Global shared storage — mounted read-only by non-main groups
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: global-pvc
  namespace: nanoclaw
  labels:
    app: nanoclaw
    component: storage
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nanoclaw-local # kind: hostPath; production: change to your RWX StorageClass
  resources:
    requests:
      storage: 5Gi
---
# Groups config storage — holds CLAUDE.md and group definitions
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: groups-pvc
  namespace: nanoclaw
  labels:
    app: nanoclaw
    component: storage
spec:
  accessModes:
    - ReadWriteMany
  storageClassName: nanoclaw-local # kind: hostPath; production: change to your RWX StorageClass
  resources:
    requests:
      storage: 1Gi
---
# Store directory — holds channel auth data and local state
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: store-pvc
  namespace: nanoclaw
  labels:
    app: nanoclaw
    component: storage
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard # RWO is fine — only orchestrator uses this
  resources:
    requests:
      storage: 1Gi
